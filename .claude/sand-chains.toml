# sand-chains.toml — per-role fallback chains for sand's dispatch.
#
# Chain rationale per project owner:
#   builder       = ollama-local (qwen3-coder:30b, slots=1 SYSTEM-WIDE) → claude haiku fallback
#   planning      = codex gpt-5.4 high read-only (matches the old bin-sh chain)
#   plan-qa       = claude opus (combined proof+falsification, read-only plan review)
#   build-qa      = claude sonnet (combined proof+falsification, runs mage gates)
#   closeout      = claude opus (matches old bin-sh)
#
# Slot enforcement is cross-process via syscall.Flock on
# /tmp/sand-slots/<backend>/<model-slug>/slot.<N>.lock. ollama-local slots=1
# means at most ONE qwen3-coder:30b spawn at a time across every sand binary
# on the machine — VRAM/thermal budget protection.

[chains]

# Builder — atomic 1-2 small blocks per cascade methodology.
# Tier 1 ollama-local (free, GPU-bound, slots=1).
# Tier 2 claude-native haiku (3x cheaper than sonnet per Anthropic pricing).
"ta-go-builder" = [
  { backend = "ollama-local",  model = "qwen3-coder:30b", slots = 1, wait_max = 30, opts = "" },
  { backend = "claude-native", model = "haiku",           slots = 0, wait_max = 0,  opts = "" },
]

# Planning — codex gpt-5.4 high reasoning, read-only sandbox.
# Single tier — matches the legacy bin-sh chain exactly.
"ta-go-planning" = [
  { backend = "codex-exec", model = "gpt-5.4", slots = 0, wait_max = 0, opts = "--sandbox read-only -c model_reasoning_effort=high" },
]

# Plan-QA — combined proof+falsification on a planner's decomposition
# (post-d0ea915 axis split). Read-only plan review; claude opus quality floor.
"ta-go-plan-qa" = [
  { backend = "claude-native", model = "opus", slots = 0, wait_max = 0, opts = "" },
]

# Build-QA — combined proof+falsification on shipped code, runs mage gates
# (post-d0ea915 axis split). claude sonnet per the persona model hint.
"ta-go-build-qa" = [
  { backend = "claude-native", model = "sonnet", slots = 0, wait_max = 0, opts = "" },
]

# Closeout — claude opus quality floor. Matches legacy bin-sh.
"ta-closeout" = [
  { backend = "claude-native", model = "opus", slots = 0, wait_max = 0, opts = "" },
]
