drop_016 (FUTURE, gated on lagom 'fully tested + battle/e2e done'): `go get` lagom-go (GOPRIVATE), replace W7's stub projector with lagom.Project/Rewrite/Validate, joint e2e with lagom, parity across binary + Go/Py/TS bindings + Rust-lib.

