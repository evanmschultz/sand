## Build-QA Falsification Verdict — area7 audit capture + envelope counts

**Verdict: PASS**

All 12 specified attack vectors attempted. No unmitigated critical failures found.

---

### Attack Vector Results

**AV-1 — Call-site completeness (9 chain = append sites)**
MITIGATED. Enumerated all 9 sites in dispatch.go lines 290, 296, 321, 352, 359, 370, 385, 397, 406. Site 6 (success, line 370) is handled inside buildSuccessResponse. All remaining 8 non-success sites have writeAttemptAudit immediately following chain = append. No gap found.

**AV-2 — Pre-spawn vs spawn-occurred classification**
MITIGATED. Pre-spawn (slot_timeout, slot-acquire-unknown, unsupported_backend, ctx-cancel, spawn-plumbing) all pass result=nil, exitCode=-1 correctly. Post-spawn (retry_on, rate_limit/auth/network/timeout, crash/unknown) pass result=&spawnResult, exitCode=spawnResult.ExitCode correctly. ctx.Canceled/DeadlineExceeded at runErr != nil correctly passes nil (no spawnResult populated) — this is semantically post-invoke-attempt but pre-process-complete, which matches the pre-spawn sentinel contract since no exit code exists.

**AV-3 — Audit-write failure handling**
MITIGATED. buildSuccessResponse catches auditErr, emits to os.Stderr with exact prefix sand-dispatch: audit write failed:, sets logPath to empty string. Dispatch does not abort. TestDispatch_AuditWriteFailureDoesNotAbort exercises this with a blocking file at .claude/agent-runs preventing MkdirAll, captures stderr via os.Pipe, and asserts LogPath=empty + result non-empty + stderr prefix match. Fully covered.

**AV-4 — LogPath drift**
MITIGATED. WriteAuditFiles returns filepath.Abs(metaPathLocal) — the absolute path to the .meta.json file. buildSuccessResponse assigns Response.LogPath = metaPath only on success. TestDispatch_SuccessPathWritesAuditFiles asserts filepath.IsAbs(resp.LogPath) and os.ReadFile(resp.LogPath) succeeds. No relative-path or stale-path leakage found.

**AV-5 — ToolsUsedCount/MCPCallsCount v0 vs TOON scalar distinction**
MITIGATED. Two distinct things: (a) AuditRecord.ToolsUsedCount/MCPCallsCount in meta.json are 0 (v0 deferral, documented in godoc); (b) TOON tools_used_count scalar computed in responseToTOON as sum(ToolUse.Count) across Response.ToolsUsed — real parsed envelope data. No consumer asserts non-zero on the meta.json fields. The TOON scalar is exercised by TestDispatchHandlerHappyPath (tools_used_count: 12) and TestDispatchHandlerInvariantToolCountsBalance (tools_used_count: 3).

**AV-6 — Invariant fixture rigor**
MITIGATED. TestDispatchHandlerInvariantToolCountsBalance fixture: ToolsUsed=[Read:2, Bash:1] (sum=3), PermissionDenials=[Write:1] (sum=1), ToolCalls=4 entries with index 4 IsError=true (Write denial). Pre-dispatch guard fires at test-write time. TOON output assertions check tools_used_count: 3, tool_calls_count: 4, permission_denials[1]{tool,count}: and Write,1 row. Both tool_use and permission_denial branches exercised with non-zero counts.

**AV-7 — TOON output ordering**
MITIGATED. responseToTOON godoc specifies: result, served_by, tier, fallback, duration_ms, cost_usd, tokens, fallback_chain[N], tools_used[N], permission_denials[N], tool_calls[N], tools_used_count, tool_calls_count, log_path. Code matches spec exactly. tools_used_count and tool_calls_count appear at the end after all tabular fields — not immediately adjacent to their corresponding tables, but that is the spec's design. TestDispatchHandlerHappyPath pins the strict ordering via index comparison. Attack brief's 'IMMEDIATELY after' wording was checking vector language, not a spec quote.

**AV-8 — Audit-file race**
MITIGATED. MintRunID() = time.Format(20060102T150405) + UnixNano() + hex.EncodeToString([4]byte from crypto/rand) = 8 hex chars. Pattern test confirms [0-9a-f]{8}. Uses crypto/rand, not math/rand. Collision requires same UTC nanosecond AND same 4-byte random = 1/2^32 probability. 100-iteration uniqueness test passes.

**AV-9 — gitignore coverage**
MITIGATED. git check-ignore -v confirms .gitignore:38:.claude/agent-runs/ covers the path. HEAD commit (49eb98e) stat shows zero .meta.json or .out files — only source .go files and .ta substrate records.

**AV-10 — Cross-segment area5 interaction**
MITIGATED. buildSuccessResponse receives Gate-carrying params but only reads params.Role and params.Prompt for the AuditRecord. ArgvShape=nil (v0 deferral). Gate field is not serialized to audit. No nil dereference. buildSpawnRequest(params, p, spawnModel, renderedMCPPath) correctly threads params.Gate into SpawnRequest.Gate per area5 contract.

**AV-11 — mage testPkg vs mage check flake**
MITIGATED. mage testPkg ./internal/dispatch: 2.164s PASS uncached. mage check: all 10 packages PASS (backends 7.972s, dispatch 2.164s, others <2s). No transient flake observed.

**AV-12 — -race flag absence (pre-existing NIT)**
ACCEPTED RISK (pre-existing). magefile_test_targets.go Test(), TestPkg(), TestFunc() all invoke go test without -race. Confirmed in source. This is a pre-existing NIT from area5 plan-QA-falsification, not introduced by area7. No new data races introduced by area7's file-I/O audit path (WriteAuditFiles is called once per tier serially; writeAttemptAudit is called from a single goroutine per dispatch invocation).

