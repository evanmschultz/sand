## Build-QA Falsification — area6 Verdict: PASS-WITH-FINDINGS

HEAD=49eb98e. All 8 attack vectors attempted. No unmitigated critical failures.

### AV1 — Sentinel positioning

MITIGATED. Spawn execution order: LookPath (line 141) → renderArgs → renderEnv → requireAPIKey (line 156) → exec.CommandContext (line 160). LookPath error fires before requireAPIKey. MissingBinaryReturnsError exemption is architecturally correct.

### AV2 — Whitespace-only API key

MITIGATED. requireAPIKey uses strings.TrimSpace(parts[1]) != "" which correctly handles spaces, tabs, newlines, and empty string. Code is correct. Test only covers empty-string case but code handles all whitespace variants.

### AV3 — Fixture coverage gap

MITIGATED. Verified 14 Spawn-calling tests have t.Setenv("ANTHROPIC_API_KEY", "sentinel-token"). Three Preview-only tests are correctly exempt (Preview never calls Spawn or requireAPIKey). Three new behaviour tests manage their own key setup. MissingBinaryReturnsError is correctly exempt (LookPath fires first).

### AV4 — Behaviour test coverage

NIT. RefusesWithoutAPIKey verifies error type (errors.Is(err, ErrAPIKeyRequired)) and zero SpawnResult (ExitCode=0, len(Stdout)=0, len(Stderr)=0) but does not explicitly verify the argv recorder file is empty. The code path makes subprocess spawn impossible (requireAPIKey returns before exec.CommandContext), so the zero-result assertion is sufficient indirect evidence. Not a critical failure.

### AV5 — BackendConfig.Env override (FINDING)

ACCEPTED RISK. Scenario: process env has ANTHROPIC_API_KEY= (explicitly set to empty, not unset) AND BackendConfig.Env provides ANTHROPIC_API_KEY=sk-real-key. renderEnv produces an envOut slice with DUPLICATE ANTHROPIC_API_KEY entries: the empty one from filterEnv(os.Environ()) appears first, then the template-rendered one appears second. requireAPIKey passes (scans sequentially, finds the non-empty entry). However, real claude subprocess launched with cmd.Env containing duplicate keys would see the FIRST entry (empty) as the authoritative value via Unix getenv() semantics.

The AcceptsAPIKeyFromBackendConfigEnv test uses t.Setenv("ANTHROPIC_API_KEY", "") + BackendConfig.Env template, then asserts strings.Contains(envText, "ANTHROPIC_API_KEY=templated-sentinel"). The assertion passes because the env dump contains both lines but does NOT verify ordering/first-occurrence semantics.

This is an accepted risk because: (a) users with no API key typically have the var UNSET (not set to empty), in which case os.Environ() excludes it and no duplicate exists; (b) the scenario requires a user to explicitly set ANTHROPIC_API_KEY= to empty in their shell, which is unusual; (c) the fix (filterEnv should also strip ANTHROPIC_API_KEY before appending BackendConfig.Env entries) would be a behavioral change warranting its own droplet. Flagged for orchestrator awareness.

