**Fix:** Close the open question. Specify: the four hermetic `-c` flags MUST go inside `renderArgs` (or into `BackendConfig.Args` in the TOML fixture) so `Preview` includes them. Remove the Spawn-append option from the description.

### F3 — `TestCodexExecBackend_HappyPath` `requiredFlags` assertion will break

**File:** `/Users/evanschultz/Documents/Code/hylla/sand/main/internal/backends/codex_exec_test.go` line 209-219

`requiredFlags` contains `"--ignore-rules"`. Removing it from `fullArgsCodexExecTOML` means `containsArg(argv, "--ignore-rules")` returns false and `t.Errorf("argv missing required flag %q")` fires. The acceptance criteria says the test "passes with the new argv" but does not enumerate: remove `"--ignore-rules"` from `requiredFlags`; add `"--ignore-user-config"`.

**Fix:** Add to droplet 1 AC: "Remove `--ignore-rules` from the `requiredFlags` slice in `TestCodexExecBackend_HappyPath` and add `--ignore-user-config`."

### F7 — Package doc comment in `codex_exec.go` not in droplet 1 scope

**File:** `/Users/evanschultz/Documents/Code/hylla/sand/main/internal/backends/codex_exec.go` line 4-5

The package doc says: `"spawns the codex CLI via os/exec under codex exec --ephemeral --ignore-rules --skip-git-repo-check -C <cwd> -m <model>"`. No acceptance criterion mentions updating this comment. After droplet 1 ships, the package doc will be stale.

**Fix:** Add to droplet 1 AC: "Update the package doc comment in `codex_exec.go` line 4-5: replace `--ignore-rules` with `--ignore-user-config`."

### F8 — `TestCodexExecBackend_HermeticitySmoke` cannot inspect `rules/default.rules` post-Spawn; fake-codex fixture not in `paths`

**Files:** `internal/backends/codex_exec_test.go` (droplet 4); `internal/backends/testdata/fake-codex-happy/codex.sh` (not in droplet 4 paths)

