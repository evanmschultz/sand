description = """
## Objective

Create a new file `internal/backends/codex_hermetic.go` (new — not yet in tree) containing the `newHermeticCodexHome` package-private function. This mirrors the bash oracle (bin/agent-dispatch.sh:521-547):

1. `os.MkdirTemp("", "codex-hermetic.*")` — creates the hermetic dir.
2. For each of `auth.json`, `version.json`, `installation_id`, `models_cache.json`: if `~/.codex/<file>` exists, `os.Symlink` it into the temp dir.
3. `os.MkdirAll(dir+"/rules", 0o700)`.
4. Write `rules/default.rules` with execpolicy prefix_rule entries:
