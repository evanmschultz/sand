## NITs

### NIT-F1: `writeAttemptAudit` signature missing ArgvShape data

The `wire_failures` AC defines `writeAttemptAudit(auditDir, runID string, attempt Attempt, role, model string, result *backends.SpawnResult, promptBytes int)`. The body must populate `AuditRecord.ArgvShape = nil for pre-spawn paths or argvShapeFor(req) for spawn-occurred paths (pass via parameter)` — but the signature has NO `req` parameter and NO `argvShape []string` parameter. The helper can't compute ArgvShape from its inputs. Two fixes:

- (preferred) Add `argvShape []string` as a parameter; call sites compute `argvShapeFor(req)` (or pass `nil`) inline.
- OR add `req *backends.SpawnRequest` parameter and let the helper call argvShapeFor; pre-spawn sites pass nil.

Amend `wire_failures` AC to disambiguate. Builder will discover this regardless, but fixing the AC upstream saves a build-QA round.

### NIT-F2: Existing TestDispatchSuccess* tests' params.CWD writability not audited

`dispatch_test.go` has 8+ existing `Dispatch(ctx, Params{...})` integration tests at lines 410/463/486/515/549/588/617/653/695. After wire_success lands, the success branch UNCONDITIONALLY calls WriteAuditFiles(filepath.Join(params.CWD, ".claude/agent-runs"), ...). If any existing test passes a params.CWD that is not writable (or doesn't expect a .claude/agent-runs/ subdir to be created), WriteAuditFiles will fail and the AC's `metaPath=""` fallback means `Response.LogPath == ""` for what should be a success — silently breaking any test that asserts LogPath is set (the new TestDispatchSuccess* tests do).

The wire_success AC says 'Existing tests that call buildSuccessResponse directly may need a one-line signature update' — but buildSuccessResponse has ZERO direct test callers (`rg buildSuccessResponse\\(`). The real risk is Dispatch() integration tests whose params.CWD isn't t.TempDir(). Amend the AC to require: 'Audit ALL existing Dispatch() integration tests' params.CWD; ensure each is t.TempDir() or that the test is OK with audit-files materializing in its working dir.'

### NIT-F3: argv_shape semantics — Preview output ≠ actual exec.Cmd argv

`wire_success` defines `argvShapeFor(backend, req)` as 'returns `backend.Preview(req)` split on whitespace — defined as a one-liner'. Three sub-issues:
- `Backend.Preview` returns `(string, error)` (`internal/backends/backend.go:52`). A 'one-liner' can't ignore the error cleanly — at minimum a 3-line helper. Acceptable but flag the misnaming.
- Preview is documented as a HUMAN-INSPECTABLE shape (per its godoc) — it is NOT necessarily the byte-for-byte argv passed to exec.Cmd. Field name `argv_shape (string slice)` implies the real argv. Either rename the field to `preview_argv` or document that argv_shape is the rendered preview, not the literal argv.
- Whitespace-splitting Preview text discards quoting and merges spaces inside argv elements. For most argv this is fine; for any argv carrying quoted whitespace it loses info. Document the limitation in the AC.

None of these block the cascade. All can be amended into wire_success's AC or accepted as known-limitations in the meta.json schema doc.

