# Plan-QA Falsification Verdict: PASS-WITH-FINDINGS

This re-run independently confirms F1, F3, F7, and F8 from the prior falsification comment and adds one concrete oracle-coverage finding (F9). No critical FAIL trigger found in the decomposition shape itself; the findings are plan amendments to remove builder footguns before dispatch.

## Critical Findings

### F1 — Confirmed: Spawn-append option can make Preview omit the four hermetic `-c` flags

`internal/backends/codex_exec.go:202-204` shows `Preview` calls `renderArgs` only. `Spawn` appends MCP flags after `renderArgs` at `codex_exec.go:132-134`, and `Preview` explicitly omits MCP probing at `codex_exec.go:198-201`.

The droplet 1 description allows the four hermetic flags to be appended in `Spawn`, but the bash oracle builds them into `cmd[]` before dry-run output: `approval_policy` at `bin/agent-dispatch.sh:393`, `web_search` at `:414`, `project_doc_max_bytes` at `:421`, `skills.bundled.enabled=false` at `:428`, then dry-run prints `cmd[@]` at `:503-507`.

Concrete counterexample: builder chooses the allowed `Spawn` append path. Spawn argv passes, but `TestCodexExecBackend_PreviewShape` cannot see the four flags because Preview never calls Spawn. Fix droplet 1 by requiring the four static flags to live in `renderArgs` or a helper called by `renderArgs`, before MCP injection.

### F3 — Confirmed: `requiredFlags` still pins `--ignore-rules`

`internal/backends/codex_exec_test.go:209-216` has `requiredFlags` containing `--ignore-rules`; the fixture also still has `--ignore-rules` at `codex_exec_test.go:57`. Removing the old flag from the fixture without updating `requiredFlags` makes `TestCodexExecBackend_HappyPath` fail at `codex_exec_test.go:217-219`.

Fix droplet 1 AC to explicitly replace `--ignore-rules` with `--ignore-user-config` in `requiredFlags`.

### F7 — Confirmed: package doc comment still names `--ignore-rules`

`internal/backends/codex_exec.go:4-5` documents the command as `codex exec --ephemeral --ignore-rules --skip-git-repo-check ...`. Droplet 1 owns `codex_exec.go` but does not explicitly mention the package doc. This can ship stale developer-facing contract text even if tests pass.

Fix droplet 1 AC to update the package doc comment.

### F8 — Confirmed: HermeticitySmoke cannot inspect rules after cleanup, and fixture edit is out of path scope

Droplet 3 requires `defer cleanup()` immediately after `newHermeticCodexHome`; therefore after `Spawn` returns, `CODEX_HOME` should already be removed. Droplet 4 nevertheless requires reading `rules/default.rules` from the env-recorded CODEX_HOME after Spawn returns.

The existing fake codex fixture records argv/stdin/env only: `internal/backends/testdata/fake-codex-happy/codex.sh:12-28`. It does not copy `rules/default.rules` before cleanup. Droplet 4 says to modify the fixture if needed, but its `paths` only include `internal/backends/codex_exec_test.go`, not `internal/backends/testdata/fake-codex-happy/codex.sh`.

Fix by either weakening the smoke test to env/tempdir/cleanup only, relying on droplet 2 helper tests for rules content, or add the fixture path and specify a `FAKE_CODEX_RULES_OUT` copy seam.

### F9 — New: symlinked CODEX_HOME files are specified but not test-pinned

The oracle symlinks `auth.json`, `version.json`, `installation_id`, and `models_cache.json` from `$HOME/.codex` into the hermetic home at `bin/agent-dispatch.sh:523-524`. Droplet 2 describes this behavior, but its enumerated tests cover only dir creation, rules file content, extra deny patterns, and cleanup. Its AcceptanceCriteria also does not explicitly require a symlink assertion.

Concrete counterexample: a builder can implement `newHermeticCodexHome` with tempdir + rules + cleanup but omit the symlink loop; every listed droplet 2 test still passes. Add a focused test that seeds a temp HOME `.codex/auth.json` (or all four files), calls `newHermeticCodexHome`, and verifies the corresponding hermetic path is a symlink before cleanup.

## Attack Vectors Tried

- Under-decomposition: mitigated. Droplets are small enough. D1 is broad but cohesive argv-contract work plus fixture/doc fallout; D4 is tests only.
- Under-recursion: mitigated. No leaf requires a child planner.
- Over-decomposition: mitigated. The helper/wiring/test separation is useful and consumed downstream.
- Missing blockers: mitigated. Shared files/package are serialized: D1 -> D2 -> D3 -> D4.
- Over-blockers: accepted-risk. D2 does not share files with D1, but same-package compile sequencing is defensible and cheap here.
- Untestable AC: failure F8 for post-cleanup rules inspection.
- Cascade-tree misclassification: mitigated. Droplets have no children; build-QA pair blocks on all four droplets. Per methodology rule 6, absence of per-droplet LLM QA is correct.
- Hallucinated symbols: mitigated. Existing symbols/files verified: `codexExecBackend.Spawn`, `Preview`, `renderArgs`, `renderMCPInjectionFlags`, `TestCodexExecBackend_HappyPath`, `TestCodexExecBackend_PreviewShape`, `installFakeCodex`, `DefaultBackendsTOML`. New files `codex_hermetic.go` / `codex_hermetic_test.go` are not in tree and are described as new.
- Missed consumers: mitigated via Hylla inbound refs for `codexExecBackend.Spawn`, which returned 12 test callers in `codex_exec_test.go`; plan touches the correct test file.
- Methodology drift: mitigated. Verification commands are mage-only; Area 4 and Area 5 boundaries are stated; build-QA pair is segment-level.
- Smart-default footguns: failure F1 and F9.
- Shipped-but-not-wired: mitigated. D2 creates helper, D3 wires it, D4 tests Spawn-path behavior.
- Scope bleed Area 4: mitigated. `renderMCPInjectionFlags` is explicitly excluded.
- Scope bleed Area 5: mitigated. `SpawnRequest` currently has no `BashDenyPatterns` field (`internal/backends/backend.go:88-97`), so D3's `nil` is an intentional Area 5 handoff.
- Git-mutation execpolicy rejection: accepted-risk. The plan tests generated `prefix_rule` content rather than invoking real Codex's execpolicy interpreter, which is appropriate for hermetic unit tests. D2 should still pin all git verb lines.

