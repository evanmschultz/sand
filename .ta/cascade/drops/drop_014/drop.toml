Counterexample request shape:

```json
{"edit":["/abs/project/internal/dispatch/dispatch.go"],"bash_deny":["git commit"],"network":false}
```

Following the plan as written, `a5_gate_param_plumbing` and `a5_spawnrequest_gate_field` preserve `Edit`, `EditPresent`, `BashDeny`, and `Network`, then `a5_codex_gate_translation` can legally fall back to `req.CWD` because `WritableDirs` is empty. Codex has no per-file edit enforcement, so this accepts a file-scoped edit gate as project-dir writable execution. That violates AGENT_SANDBOX_SPEC.md lines 67-74 and the QA record's own acceptance criterion: "Attempts to find codex edit files accepted without writable_dirs."

