DEFECT FIX (dogfood finding 2026-05-24). Sand's claude-native backend renders the persona `tools:` CSV into `--allowedTools` ONLY (see internal/installseed/installseed.go:64 `allowed_tools_arg = "--allowedTools"`, and the seeded backends.toml `allowed_tools_arg`/`allowed_tools_csv_template` plumbing consumed by internal/backends/claude_native.go renderAllowedToolsCSV → renderArgs appends `--allowedTools <csv>`). Per CLAUDE.md §'Role-appropriate tool allowlists' and README.md:164-166, the persona `tools:` line is intended to BE the sandbox ("The persona file IS the sandbox spec for that role"). That guarantee is FALSE today.

EMPIRICAL EVIDENCE captured live this session against the real `claude` CLI:
(1) `echo '...use the Bash tool to run echo hello-from-bash...' | claude -p --bare --output-format json --no-session-persistence --model haiku --allowedTools Read` → the Bash tool RAN successfully (is_error:false, output 'hello-from-bash'). `--allowedTools` did NOT prevent a tool that was not on the list.
(2) The SAME prompt with `--tools Read` (instead of `--allowedTools Read`) → agent replied 'I don\\'t have access to a Bash tool ... I only have the ability to use the Read function.' The Bash tool did not exist in the toolset.
(3) `claude --help`: `--allowedTools` = 'list of tool names to allow' (auto-approve WITHOUT prompting; additive). `--tools` = 'Specify the list of available tools from the built-in set. Use "" to disable all tools, "default" to use all tools, or specify tool names (e.g. "Bash,Edit,Read").' — `--tools` is the toolset RESTRICTOR.

CONCLUSION: `--allowedTools` is a prompt-suppression / auto-approve list, NOT a sandbox boundary. To actually enforce the persona allowlist sand must render the persona tool names into `--tools` (availability restriction). Scoped Bash patterns (e.g. `Bash(mage testFunc *)`) are a wrinkle: `--tools` takes bare tool NAMES (Bash, Read, Edit, ...), while the scoped patterns belong on `--allowedTools` (auto-approve the safe subset) and/or `--disallowedTools` / a `--settings` permissions block / `--permission-mode` for deny-by-default on non-matching Bash invocations. The exact robust recipe is the PLANNER's call, grounded in `claude --help` (captured at /tmp/claude-help.txt) and Context7 claude-code docs. CODEX BACKEND uses per-tool approval_mode=approve (different mechanism) — planner must confirm whether the codex path has an analogous gap or is already correct.

This drop is sandbox-enforcement ONLY. The envelope-parser tool-audit defect is tracked separately as drop_013 (parser); do NOT fold parser work into this drop.
"""
