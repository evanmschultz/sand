## QA Proof
Premises:
- The plan is proof-complete only if every claimed seam, flag semantic, and recursion boundary is tied to current evidence.

Evidence:
- The drop record itself provides the empirical claude CLI evidence.
- Context7 provides the current permission-flag semantics for `--tools`, `--allowedTools`, and `--permission-mode dontAsk`.
- `mcp__gopls__` confirms the existing sand symbols this plan reuses and identifies the precise files the builders must touch.
- `git show HEAD` confirms the current committed text in `internal/backends/backend.go`, `internal/backends/template.go`, `internal/backends/claude_native.go`, `internal/installseed/installseed.go`, `README.md`, `CLAUDE.md`, and `SAND-SPEC.md`.

Trace or cases:
- Existing symbols are cited as existing only when they were verified (`BackendConfig`, `SpawnRequest`, `SubstituteSlice`, `claudeNativeBackend`, `renderArgs`, `renderAllowedToolsCSV`, `codexExecBackend.renderArgs`, `RenderMCPInlineTOML`).
- New symbols are marked as new, not yet in tree (`TemplateData.PersonaToolNamesCSV`, `BackendConfig.ToolsArg`, `BackendConfig.ToolsCSVTemplate`, and one de-scope helper for bare tool names).
- Each child planner's write scope matches a real file cluster and every builder path is narrow enough to be buildable.

Conclusion:
- QA Proof confirms the evidence is complete enough to support this decomposition.

Unknowns:
- Codex built-in tool-surface semantics are not re-proved here because the current drop evidence targets claude-native only. The planner records the distinction explicitly instead of claiming a false parity proof.

## QA Falsification
Premises:
- The main counterexamples to attack are: the recipe could be under-specified, the de-scope helper could require a wider template change than planned, the installseed/docs lanes could drift from runtime behavior, or codex parity could be silently hand-waved.

Evidence:
- The recipe is grounded in current Claude docs and fixed concretely to `--tools` + `--allowedTools` + `--permission-mode dontAsk`.
- The template surface is widened explicitly because a de-scoped CSV must be expressible in TOML; this avoids the counterexample where `tools_csv_template = "{{.PersonaToolsCSV}}"` would reintroduce scoped `Bash(...)` into `--tools`.
- The installseed and docs builders both block on the runtime builders, which removes the mismatch counterexample.
- Codex parity is called out as an explicit note with current-code evidence instead of being silently assumed correct.

Trace or cases:
- Attack A: `--disallowedTools Bash` as deny-by-default. Rejected because it conflicts with the allowed `Bash(...)` subset.
- Attack B: leave the de-scoped value out of `TemplateData`. Rejected because the seed/docs lane then cannot truthfully configure `tools_csv_template`.
- Attack C: merge installseed/docs into the backend lane. Rejected because it crosses package/domain boundaries and would hide the dirty-worktree delta handling.
- Attack D: invent a codex builder with no truthful code or test output. Rejected; the plan records codex as an explicit note instead.

Conclusion:
- QA Falsification found no unmitigated counterexample to the three-lane decomposition or to the chosen claude-native recipe.

Unknowns:
- The `dontAsk` read-only Bash exception remains a routed caveat that the docs lane must state accurately.

## Convergence
Premises:
- Convergence requires a stable recipe, complete evidence, no unmitigated falsification finding, and routed Unknowns.

Evidence:
- The recipe is fixed.
- Existing symbol and file evidence is complete enough for planning.
- Every cross-lane dependency is encoded with real ids.
- Remaining Unknowns are disclosed in this certificate and in `risk_notes` rather than silently erased.

