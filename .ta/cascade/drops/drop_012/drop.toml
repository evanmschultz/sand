# Section 0 — SEMI-FORMAL REASONING

## Proposal
Premises:
- `drop_012.drop.sandbox_enforcement` captures a real claude-native sandbox defect: sand currently renders persona `tools:` only into `--allowedTools`, but the live claude CLI evidence says `--tools` is the actual toolset restrictor.
