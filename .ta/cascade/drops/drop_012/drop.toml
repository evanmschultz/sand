- Remaining Unknowns are routed: Hylla-surface unavailability is disclosed; the `dontAsk` read-only Bash caveat is documented; codex built-in semantics are left as an explicit note instead of a false proof.

Conclusion:
- The L2 decomposition is ready for plan-QA and downstream builder dispatch.

Unknowns:
- None beyond the routed items named above.
