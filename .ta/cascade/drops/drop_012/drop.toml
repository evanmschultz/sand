- Workspace local deltas are limited to `README.md`, `SAND-SPEC.md`, and `internal/installseed/installseed.go`, and each delta is the prior `.Cwd` -> `.CWD` doc/comment fix rather than a competing sandbox change.

Trace or cases:
- Case 1: the backend runtime lane must add a de-scoped tool-name surface plus the claude-native `--tools` render path.
- Case 2: the installseed lane must carry the same recipe into the default claude-routed backend templates without overwriting user config.
- Case 3: the docs lane must stop claiming `--allowedTools` alone is the sandbox and must document the `--tools` + `--allowedTools` + `--permission-mode dontAsk` split.
- Case 4: codex parity is handled as an explicit note, not a speculative builder: committed `codexExecBackend.renderArgs` does not use persona CSV for built-ins, and `RenderMCPInlineTOML` only auto-approves discovered MCP tools with `approval_mode="approve"`. That is not the same defect mechanism as claude-native's `--allowedTools` misuse.

Conclusion:
- Recurse the L2 scope into three L3 planners: backend runtime, installseed defaults, and docs contract. The backend L3 emits three atomic builders; installseed emits one; docs emits one. Cross-lane ordering is encoded with real droplet ids.

Unknowns:
- A dedicated `mcp__hylla__*` artifact surface for `github.com/evanmschultz/sand@main` was not exposed in this Codex session, so existing-symbol verification uses `mcp__gopls__` on the active sand workspace plus committed `git show HEAD` reads instead. That fallback is sufficient for planning but remains explicitly disclosed.
