- The root drop's objective and acceptance criteria record the live probes: `--allowedTools Read` still allowed Bash, while `--tools Read` removed Bash from the available toolset.
- Context7 `/websites/code_claude` says `--tools` restricts built-in tools, `--allowedTools` auto-approves matching rules, and `--permission-mode dontAsk` denies tool calls not pre-approved instead of prompting.
- `mcp__gopls__` on the sand workspace verified `backends.BackendConfig`, `backends.SpawnRequest`, `backends.SubstituteSlice`, `backends.claudeNativeBackend`, `claudeNativeBackend.renderArgs`, and `claudeNativeBackend.renderAllowedToolsCSV`.
