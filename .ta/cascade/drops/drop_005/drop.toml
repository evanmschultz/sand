Falsification PASS overall — 3 mitigated findings + 5 attempted attacks deflected. Verdict: PASS with mitigations. Planner is sound but acceptance criteria should be tightened in 2-3 places before builder dispatch (see findings F1 + F2 + F3). All other attacks bounce off.

## Section 0

## Proposal
Premises: drop_005.drop.planner_codex_envelope_l3 emits 3 ordered builder droplets (parser FIRST, factory SECOND, dispatch routing THIRD) for codex stream support. Evidence: read of the planner record, parent L2 planner record, sibling probe/exec L3 records, committed internal/dispatch/envelope.go, internal/dispatch/dispatch.go (buildSuccessResponse at line 378-401), internal/backends/backend.go (Resolve switch at lines 221-230), internal/backends/backend_test.go (the existing codex-exec ErrUnsupportedEnvelopeFormat gate assertion at lines 178-181), internal/dispatch/dispatch_test.go (TestDispatchFailoverChain at L942, TestDispatchHappyPath at L690, TestResponseV02Fields at L1173), internal/dispatch/tool_dispatch_test.go (TestDispatchHandler{MissingRole,MissingPrompt,...} at L101+), SAND-V02-SPEC §5.3 + §7.3, ~/.claude/codex-mcp-dispatch-tool-conversion.md (HTTP transport quirks, tool-name format table). Trace or cases: attacks F1-F8 enumerated below. Conclusion: planner is shippable WITH acceptance-criteria tightenings. Unknowns: none blocking falsification.

## Builder (Attacks Constructed)
Premises: a planner-QA falsifier attacks via counterexample construction without writing source. Evidence: every attack below is backed by file:line citations and confirmed against committed code. Trace or cases:

### F1 (FINDING — RECOMMENDED TIGHTENING) — backend_test.go TestBackendConfigTOMLDecodeAllFields asserts codex-exec returns ErrUnsupportedEnvelopeFormat
Claim under attack: planner says `build_codex_backend_factory` widens Resolve so `codex_stream` returns `codexExecBackend`. The planner's preserved-tests enumeration says `backend_test.go already exists under internal/backends/` (acceptance_criteria) but does NOT call out that `TestBackendConfigTOMLDecodeAllFields` at backend_test.go:178-181 HARDCODES the assertion `if _, err := Resolve(projectDir, "codex-exec"); !errors.Is(err, ErrUnsupportedEnvelopeFormat) { t.Fatalf(...) }`. When factory widens Resolve, that assertion WILL fail unless inverted. Reproduction: backend_test.go line 179 literal `!errors.Is(err, ErrUnsupportedEnvelopeFormat)`. Planner's `paths` does include `internal/backends/backend_test.go` so builder CAN touch it, but acceptance criteria don't direct it. Mitigation status: AMBIGUOUS — careful builder will fix; sloppy builder eats a re-spin. Severity: low-medium. Recommendation: amend planner acceptance to explicitly say `build_codex_backend_factory MUST invert the existing TestBackendConfigTOMLDecodeAllFields codex-exec gate assertion at backend_test.go:178-181 to assert the new positive resolution (returns *codexExecBackend with no error). The per-field BackendConfig assertions for codex-exec at lines 246-276 must remain intact.`

### F2 (FINDING — RECOMMENDED TIGHTENING) — §7.3 also requires tool_calls[N] ordered list
Claim under attack: planner says `build_codex_envelope_parser` extracts `mcp: <server>/<tool> (completed)` into ToolsUsed, failed lines into PermissionDenials, narrative into Result. Evidence from SAND-V02-SPEC §7.3 line 337: `The codex_stream envelope parser extracts these into the tools_used[N]{name,count} aggregate + tool_calls[N] ordered list`. Response.ToolCalls is already declared in dispatch.go:535 per drop_008. Planner only names ToolsUsed + PermissionDenials — omits the ordered ToolCalls slice. Currently buildSuccessResponse never populates ToolCalls (committed claude path also leaves it nil pending drop_007). Mitigation status: PARTIAL — a builder could argue ToolCalls stays nil until drop_007 wiring, but §7.3 explicitly couples codex_stream parsing to tool_calls[N] population. Severity: low (functionally correct without it; per-spec cosmetic gap). Recommendation: planner acceptance should say either (a) ToolCalls population is explicitly out-of-scope-deferred to drop_007, or (b) parser populates an ordered ToolCalls slice and routing droplet wires it through.

### F3 (FINDING — RECOMMENDED CLARIFICATION) — buildSuccessResponse signature ambiguity for envelope variant
Claim under attack: planner says `build_codex_dispatch_parser_routing` edits dispatch.go's success path to parse by envelope format. Evidence: buildSuccessResponse at dispatch.go:378 takes `(params, tier, servedModel, tierIdx, result backends.SpawnResult, chain)` and hardcodes `ParseEnvelope(result.Stdout)`. To route by envelope format, the routing droplet needs ONE of: (a) plumb BackendConfig.EnvelopeFormat through (Resolve returns a Backend not the config — needs a new accessor), (b) Backend interface gains `EnvelopeFormat() string` (adds an interface method — planner forbids `Backend-interface refactor`?), (c) dispatch picks parser via type-switch on backend (anti-pattern for plugin shape), or (d) buildSuccessResponse becomes a wrapper that dispatches to claude/codex variants. Planner doesn't pre-pick. Sibling L3 planner_codex_exec_l3 acceptance forbids editing backend.go and dispatch.go from the exec lane — so the interface method extension can only land in this envelope lane. Mitigation status: BUILDER AMBIGUITY → re-spin risk. Severity: low (any of (a)/(b)/(d) is small). Recommendation: planner acceptance should pre-pick a routing mechanism — likely extend Backend with `EnvelopeFormat() string` returning the cfg field, OR add a small private accessor function in backends package.

### F4 (ATTACK DEFLECTED) — stream parsing edge cases (multi-line interleaving, EOF partial lines, chunk buffering)
Claim under attack: parser handles only line-oriented `mcp: <server>/<tool> (completed)` lines. Codex stream may interleave multi-line agent narrative WITH `mcp:` lines, end without trailing newline, or span chunk boundaries. Evidence: SAND-V02-SPEC §7.3 says `line-oriented stream`; the verification recipe in the conversion doc uses `grep 'mcp:' <output-file>` — implying parser is file/buffer-final, not streaming. SpawnResult.Stdout is `[]byte` (backend.go:107) captured in full after process exit, so chunk-boundary buffering is N/A. EOF-without-newline + multi-line interleaving are real but trivial — standard `bufio.Scanner` over the []byte handles missing trailing newline correctly. Severity: NONE — testable in the parser builder droplet's tests (planner acceptance already calls out `multiple tools, empty/no-tool output, preservation of narrative result text`). DEFLECTED.

### F5 (ATTACK DEFLECTED) — tool-name parsing edge cases (slashes in `<server>/<tool>`, dotted names, underscores)
Claim under attack: parser must handle `mcp: hylla/hylla.search.vector (completed)`, `mcp: ta/get (completed)`, `mcp: tillsyn/till.attention_item (completed)`. Evidence: ~/.claude/codex-mcp-dispatch-tool-conversion.md shows `<server>/<canonical-name>` is the codex format, with canonical names sometimes containing dots and underscores. The parser MUST treat the entire post-`mcp: ` and pre-` (completed)` substring as the ToolsUsed key (the FULL `<server>/<name>` token IS the canonical codex identifier surfaced in audit — matching the conversion doc's `Codex display (stream)` column). The parser should NOT split on `/` (that loses information for tools with dotted names; also, server names with embedded slashes don't exist in canonical codex output). Severity: NONE — the planner accepts the parser owns this surface and calls out `multiple tools` test coverage. DEFLECTED with implementation note for builder: treat the entire post-`mcp: ` token as the key.

### F6 (ATTACK DEFLECTED) — factory widening might break unknown/empty envelope_format paths
Claim under attack: factory droplet widens Resolve switch from `case claude_json, "":` to also include `case codex_stream:`. Default branch still returns ErrUnsupportedEnvelopeFormat (lines 224-228). Evidence: backend.go:221-230 — the case-statement is the only mutation point. Planner acceptance: `claude_json still returns claudeNativeBackend and unknown formats still return ErrUnsupportedEnvelopeFormat` — verbatim correct. DEFLECTED.

### F7 (ATTACK DEFLECTED) — backward compat for TestDispatchHandler*/TestDispatchHappyPath/TestDispatchFailoverChain
Claim under attack: dispatch.go routing edits must not regress existing claude-only tests. Evidence: TestDispatchHandlerMissingRole/MissingPrompt (tool_dispatch_test.go:101+) test the MCP handler shape — unaffected by envelope-format routing. TestDispatchHappyPath (dispatch_test.go:690) installs fake-claude-envelope, runs through claude-native tier with EnvelopeFormat=claude_json — must remain green if routing keys correctly off envelope_format. TestDispatchFailoverChain (dispatch_test.go:942) runs through claude-native tiers exclusively — same condition. TestResponseV02Fields (dispatch_test.go:1173) is a pure struct-shape test — unaffected. Planner acceptance explicitly preserves these contracts. DEFLECTED.

### F8 (ATTACK DEFLECTED) — HC2 blocker scope: planner blocks on probe + exec L3s, correct or over-restrictive?
Claim under attack: envelope L3 blockers = `[planner_codex_mcp_probe_l3, planner_codex_exec_l3]`. The factory droplet `build_codex_backend_factory` references the `codexExecBackend` type which is OWNED by the exec lane's `build_codex_exec_backend` builder — so the factory builder MUST block on that builder (compile-fail otherwise). The probe builder is not consumed by any envelope-lane builder, so probe-blocking is over-conservative but safe. Blocking the entire L3 planner on both prior L3 planners transitively blocks all 3 envelope builders. Severity: NONE — over-blocking is safe; under-blocking would compile-fail. DEFLECTED.

## QA Proof
Premises: certificate must verify every attack is grounded in committed file:line evidence. Evidence: every F-finding cites concrete lines. F1 cites backend_test.go:178-181 (verified read). F2 cites SAND-V02-SPEC line 337 + dispatch.go:535 (ToolCalls field declared but unused in claude path). F3 cites dispatch.go:378-401 (buildSuccessResponse signature) + sibling exec L3 acceptance (forbids backend.go edits). F4 cites SAND-V02-SPEC §7.3 + backend.go:107 (SpawnResult.Stdout is full []byte). F5 cites ~/.claude/codex-mcp-dispatch-tool-conversion.md table. F6 cites backend.go:221-230. F7 cites dispatch_test.go:690/942/1173 + tool_dispatch_test.go:101+. F8 cites planner_codex_exec_l3 acceptance + envelope L3 blockers list. Conclusion: all evidence verified. Unknowns: none.

## Convergence
Premises: falsification verdict is PASS-with-mitigations. Evidence: F1 + F2 + F3 are non-blocking but recommend acceptance tightening; F4-F8 are deflected attacks. Trace or cases: planner can ship to plan-QA-proof consolidation; if proof concurs, builder dispatch can proceed AFTER orchestrator either (a) amends planner acceptance to incorporate F1/F2/F3 OR (b) accepts the residual re-spin risk explicitly. Per the cascade-field-drift memory note, after >=3 surgical amendments the orchestrator may override-PASS when implementation is functionally correct. Conclusion: PASS. Unknowns: orchestrator choice between (a) and (b).

## TL;DR
- T1 F1: backend_test.go:178-181 hardcodes the codex-exec ErrUnsupportedEnvelopeFormat assertion; factory builder MUST invert it — recommend planner acceptance call this out explicitly.
- T2 F2: SAND-V02-SPEC §7.3 line 337 couples codex_stream parsing to tool_calls[N] ordered list (Response.ToolCalls already exists at dispatch.go:535); planner names only ToolsUsed/PermissionDenials — recommend planner declare ToolCalls in-scope or explicitly defer to drop_007.
- T3 F3: dispatch routing droplet has 4 plausible mechanisms for envelope-variant dispatch; sibling exec L3 forbids editing backend.go from exec lane, so the interface method extension belongs here — recommend planner pre-pick to reduce builder re-spin risk.
