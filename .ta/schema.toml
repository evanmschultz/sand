# ============================================================================

# ----------------------------------------------------------------------------
# roadmap db — versions, items, dependencies.
# ----------------------------------------------------------------------------

[roadmap]
description = "Roadmap versions, items, and dependencies — pre-MVP and post-MVP planning surface."
paths = [".ta/roadmap/*.toml"]

[roadmap.version]
extends = "ActionItem"
description = "A roadmap version — a release band or milestone that groups roadmap items toward a target date."

[roadmap.version.fields.vision_summary]
type = "string"
format = "markdown"
description = "Narrative summary of what this version aims to deliver."

[roadmap.version.fields.target_date_band]
type = "string"
description = "Loose target window (e.g. 'Q3 2026', '2026-09', 'pre-MVP') — not a hard deadline."

[roadmap.version.fields.status]
type = "string"
required = true
enum = ["planning", "in_progress", "landed", "punted"]
description = "Version lifecycle status."

[roadmap.item]
extends = "ActionItem"
description = "A roadmap item — one work unit assigned to a roadmap.version with optional typed dependencies."

[roadmap.item.fields.target_version]
type = "string"
description = "roadmap.version record id ref."

[roadmap.item.fields.dependencies]
type = "array"
element_type = "string"
description = "roadmap.dependency record id refs."

[roadmap.dependency]
extends = "NodeBase"
description = "Typed relationship between two roadmap.item records."

[roadmap.dependency.fields.from_id]
type = "string"
required = true
description = "roadmap.item record id this dependency originates from."

[roadmap.dependency.fields.to_id]
type = "string"
required = true
description = "roadmap.item record id this dependency targets."

[roadmap.dependency.fields.kind]
type = "string"
required = true
enum = ["blocks", "enables", "supersedes", "punted_to"]
description = "Relationship kind."

[roadmap.dependency.fields.rationale]
type = "string"
format = "markdown"
description = "Free prose explaining why this dependency exists."

# ----------------------------------------------------------------------------
# template_manifest db — per-format manifests.
# ----------------------------------------------------------------------------

[template_manifest]
description = "Per-format manifests describing how a file maps to/from JSON for agent read/write."
paths = [".ta/templates/manifests/*.toml"]

[template_manifest.bases.Manifest]
extends = "NodeBase"
description = "Shared base for per-format manifest records."

[template_manifest.bases.Manifest.fields.field_type_bindings]
type = "table"
description = "Free-form table mapping block-name → JSON-type binding."

[template_manifest.bases.Manifest.fields.description]
type = "string"
format = "markdown"
description = "Free prose describing what the manifest binds."

[template_manifest.html]
extends = "Manifest"
description = "HTML-format manifest — selectors are CSS selectors via cascadia."

[template_manifest.html.fields.format]
type = "string"
required = true
enum = ["html"]
description = "Source-file format. Locked to html."

[template_manifest.html.fields.selectors]
type = "table"
description = "Free-form table mapping block-name → CSS selector."

[template_manifest.md]
extends = "Manifest"
description = "Markdown-format manifest — selectors are heading paths."

[template_manifest.md.fields.format]
type = "string"
required = true
enum = ["md"]
description = "Source-file format. Locked to md."

[template_manifest.md.fields.heading_path_selectors]
type = "table"
description = "Free-form table mapping block-name → heading path."

[template_manifest.txt]
extends = "Manifest"
description = "Plain-text manifest — selectors are regex patterns."

[template_manifest.txt.fields.format]
type = "string"
required = true
enum = ["txt"]
description = "Source-file format. Locked to txt."

[template_manifest.txt.fields.regex_selectors]
type = "table"
description = "Free-form table mapping block-name → regex pattern."

# ----------------------------------------------------------------------------
# html_template db — view-template manifests.
# ----------------------------------------------------------------------------

[html_template]
description = "HTML view-template manifests — one record per addressable view."
paths = [".ta/templates/html_views/*.toml"]

[html_template.bases.View]
extends = "NodeBase"
description = "Shared base for HTML view-template manifest records."

[html_template.bases.View.fields.view_name]
type = "string"
required = true
description = "Canonical view name."

[html_template.bases.View.fields.template_relpath]
type = "string"
required = true
description = "Template file path relative to embedded dist/."

[html_template.bases.View.fields.description]
type = "string"
format = "markdown"
description = "Free prose describing what the view renders."

[html_template.bases.View.fields.target_record_type]
type = "string"
description = "db.type the view renders, e.g. cascade.drop."

[html_template.bases.View.fields.variant]
type = "string"
enum = ["simple", "stil_full"]
default = "simple"
description = "Render variant — simple inline, stil_full themed page."

[html_template.cascade_drop_view]
extends = "View"
description = "View template for a cascade.drop record."

[html_template.cascade_planner_view]
extends = "View"
description = "View template for a cascade.planner record."

[html_template.cascade_droplet_view]
extends = "View"
description = "View template for a cascade.droplet record."

[html_template.cascade_qa_view]
extends = "View"
description = "View template for cascade.qa_proof / cascade.qa_falsification records."

[html_template.roadmap_version_view]
extends = "View"
description = "View template for a roadmap.version record."

[html_template.schema_browser_view]
extends = "View"
description = "View template for the schema browser."

# ----------------------------------------------------------------------------
# target_system db — agent-harness descriptors.
# ----------------------------------------------------------------------------

[target_system]
description = "Target agent-harness descriptors. Install behavior lives in L2-F walker, NOT here."
paths = [".ta/target_systems/*.toml"]

[target_system.bases.TargetSystem]
extends = "NodeBase"
description = "Common fields for any target agent-harness descriptor."

[target_system.bases.TargetSystem.fields.name]
type = "string"
required = true
description = "Display name."

[target_system.bases.TargetSystem.fields.install_destinations]
type = "table"
description = "subtree-name → destination path."

[target_system.bases.TargetSystem.fields.on_conflict_default]
type = "string"
enum = ["skip", "overwrite", "merge", "prompt"]
default = "prompt"
description = "Default conflict policy."

[target_system.bases.TargetSystem.fields.requires_substrate_dir]
type = "string"
description = "Absolute or ~/-rooted path to user's substrate dir."

[target_system.bases.TargetSystem.fields.description]
type = "string"
format = "markdown"
description = "Prose description of the target system."

[target_system.claude]
extends = "TargetSystem"
description = "Claude Code conventions — .claude/agents/, .claude/hooks/, .claude/skills/, .claude/settings.json fragments."

[target_system.codex]
extends = "TargetSystem"
description = "Codex conventions — .codex/agents/, .codex/config.toml fragments, AGENTS.md root file."
