[agents_md]
description = 'Project agent-rules file — Codex (AGENTS.md) and Claude Code (CLAUDE.md) conventions. Sections addressable so project.standards_markdown_id can link to a specific section.'
paths = ['AGENTS.md', 'CLAUDE.md']

[agents_md.section]
description = 'An H2 section of AGENTS.md / CLAUDE.md — addressable so project.standards_markdown_id can link to a specific section.'
heading = 2

[agents_md.section.fields]
[agents_md.section.fields.body]
format = 'markdown'
type = 'string'

[cascade]
description = 'Cascade trees — drops + their segments, confluences, droplets, planners, QA records, failures.'
paths = ['.ta/cascade/drops/drop_*/drop.toml']

[cascade.confluence]
description = 'Cascade gate node — blocks until upstream segments/droplets are complete, then releases its children. structural_type=confluence.'
extends = 'ActionItem'

[cascade.confluence.fields]
[cascade.confluence.fields.structural_type]
enum = ['confluence']
required = true
type = 'string'

[cascade.drop]
description = 'L1 cascade root — one self-contained unit of work.'
extends = 'ActionItem'

[cascade.drop.fields]
[cascade.drop.fields.drop_number]
description = 'Sequential drop number (matches the drop_N directory).'
required = true
type = 'integer'

[cascade.drop.fields.structural_type]
enum = ['drop']
required = true
type = 'string'

# F23 v2 runtime-fill: every cascade.drop record creation generates
# its two plan-QA twin records so descent into L2/L3/Ln is gated by
# schema-driven QA enforcement (drop_004 L2-J).
[cascade.drop.auto_spawn]
on_create = [
    { type = "cascade.qa_proof",         id_template = "{parent_id}-plan-qa-proof",         fields = { role = "qa-proof",         title = "Plan-QA proof of {parent.title}",  state = "{state.initial}", created_at = "{now}", updated_at = "{now}", target_id = "{parent_id}" } },
    { type = "cascade.qa_falsification", id_template = "{parent_id}-plan-qa-falsification", fields = { role = "qa-falsification", title = "Plan-QA falsif of {parent.title}", state = "{state.initial}", created_at = "{now}", updated_at = "{now}", target_id = "{parent_id}" } },
]

[cascade.droplet]
description = 'Atomic build leaf — what a builder agent finishes in one shot. Touches one file (or tight cluster) with a few blocks of change.'
extends = 'ActionItem'

[cascade.droplet.fields]
[cascade.droplet.fields.irreducible]
default = false
description = 'True if this droplet cannot be further decomposed (e.g. single function-signature change rippling through one file). Plan-QA validates the claim.'
type = 'boolean'

[cascade.droplet.fields.structural_type]
enum = ['droplet']
required = true
type = 'string'

# F23 v2 runtime-fill (FIELD-ONLY): every droplet creation generates
# its two QA twin records so the build leaf cannot slip past review.
# id_template stays v1-only ({parent_id}); field values use the v2
# tokens to fill the required-no-default fields on the target type:
#   {now}              → RFC3339 UTC timestamp at create time
#   {state.initial}    → enum[0] of the target type's `state` field
#   {parent.<field>}   → parent record's same-named field
# Structural home is [cascade.droplet] (the build leaf), NOT
# [cascade.drop] where this comment sat pre-F35.
[cascade.droplet.auto_spawn]
on_create = [
    { type = "cascade.qa_proof",         id_template = "{parent_id}-qa-proof",         fields = { role = "qa-proof",         title = "QA proof of {parent.title}",  state = "{state.initial}", created_at = "{now}", updated_at = "{now}", target_id = "{parent_id}" } },
    { type = "cascade.qa_falsification", id_template = "{parent_id}-qa-falsification", fields = { role = "qa-falsification", title = "QA falsif of {parent.title}", state = "{state.initial}", created_at = "{now}", updated_at = "{now}", target_id = "{parent_id}" } },
]

[cascade.failure]
description = 'Captured failure artifact — what went wrong, when, where, with what context. Persistent record for cascade post-mortems.'
extends = 'NodeBase'

[cascade.failure.fields]
[cascade.failure.fields.context_blocks]
element_type = 'ContextBlock'
type = 'array'

[cascade.failure.fields.diagnostic]
description = 'What broke and how it was identified.'
format = 'markdown'
required = true
type = 'string'

[cascade.failure.fields.failure_kind]
enum = ['build', 'test', 'qa-proof', 'qa-falsification', 'blocker', 'other']
required = true
type = 'string'

[cascade.failure.fields.fix_directive]
description = 'Planner-authored direction for the fix.'
format = 'markdown'
type = 'string'

[cascade.failure.fields.target_id]
description = 'ta record id of the action item that failed.'
required = true
type = 'string'

[cascade.planner]
description = "Generic planner action item — interior cascade work that doesn't fit segment or confluence (e.g. plan-revision, retro)."
extends = 'ActionItem'

# F23 v2 runtime-fill: every cascade.planner record creation generates
# its two plan-QA twin records so interior planning records (L3+ planners,
# retros, plan-revisions) are gated by schema-driven QA enforcement.
[cascade.planner.auto_spawn]
on_create = [
    { type = "cascade.qa_proof",         id_template = "{parent_id}-plan-qa-proof",         fields = { role = "qa-proof",         title = "Plan-QA proof of {parent.title}",  state = "{state.initial}", created_at = "{now}", updated_at = "{now}", target_id = "{parent_id}" } },
    { type = "cascade.qa_falsification", id_template = "{parent_id}-plan-qa-falsification", fields = { role = "qa-falsification", title = "Plan-QA falsif of {parent.title}", state = "{state.initial}", created_at = "{now}", updated_at = "{now}", target_id = "{parent_id}" } },
]

[cascade.qa_falsification]
description = "QA falsification record — actively attacks the target's conclusion via counterexamples, hidden dependencies, contract drift."
extends = 'ActionItem'

[cascade.qa_falsification.fields]
[cascade.qa_falsification.fields.role]
enum = ['qa-falsification']
required = true
type = 'string'

[cascade.qa_falsification.fields.target_id]
description = 'ta record id of the action item this QA pass attacks.'
required = true
type = 'string'

[cascade.qa_proof]
description = 'QA proof record — verifies evidence completeness and reasoning coherence.'
extends = 'ActionItem'

[cascade.qa_proof.fields]
[cascade.qa_proof.fields.role]
enum = ['qa-proof', 'qa-a11y', 'qa-visual']
required = true
type = 'string'

[cascade.qa_proof.fields.target_id]
description = 'ta record id of the action item this QA pass verifies.'
required = true
type = 'string'

[cascade.segment]
description = 'Interior cascade node — splits a drop into parallel work streams. Has children. structural_type=segment.'
extends = 'ActionItem'

[cascade.segment.fields]
[cascade.segment.fields.structural_type]
enum = ['segment']
required = true
type = 'string'

[claude_agents]
description = 'Claude Code subagent definitions. Tracks both the home library (`agents/<kind>/<name>.md`, kind-nested) and the per-project install (`.claude/agents/<flat-name>.md`, flat). Each markdown file is one agent record with YAML frontmatter as fields and the body as the system prompt.'
paths = ['agents/*/*.md', '.claude/agents/*.md']

[claude_agents.agent]
body_field = 'prompt'
description = "One Claude Code subagent definition. Filename stem is the agent's `name` field; body is the agent's system prompt. Stem layout differs by mount: home library uses `<kind>/<name>.md` (e.g. `agents/go/builder.md` → name `builder`); project install uses flat `<kind>-<name>.md` (e.g. `.claude/agents/go-builder.md` → name `go-builder`)."
record_per = 'file'

[claude_agents.agent.fields]
[claude_agents.agent.fields.color]
description = 'Optional UI hint for the Claude Code agent picker. Free-form; not enforced.'
type = 'string'

[claude_agents.agent.fields.description]
description = 'When Claude should delegate to this subagent. Surfaced to the orchestrator as the routing hint at agent-selection time.'
required = true
type = 'string'

[claude_agents.agent.fields.model]
description = "Optional Claude model identifier override (e.g. 'sonnet', 'opus'). Omit to use the orchestrator's default."
type = 'string'

[claude_agents.agent.fields.name]
description = 'Subagent identifier. Lowercase letters, digits, and hyphens only (Claude Code rule). Must match the filename stem so the on-disk name and the frontmatter name stay in sync. Home-nested example: `agents/go/builder.md` → `name = "builder"`. Project-flat example: `.claude/agents/go-builder.md` → `name = "go-builder"` (post-flatten).'
required = true
type = 'string'

[claude_agents.agent.fields.prompt]
description = "Markdown body — the subagent's system prompt. Mounted from the file body, not from frontmatter."
format = 'markdown'
required = true
type = 'string'

[claude_agents.agent.fields.tools]
description = "Optional comma-separated tool allowlist (e.g. 'Read, Edit, Bash, mcp__hylla__hylla_search'). Omit to inherit the orchestrator's full tool set. Stored as a single YAML scalar to match Claude Code's frontmatter convention."
type = 'string'

[contributing]
