name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: mage ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install mage
        run: go install github.com/magefile/mage@latest

      - name: install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: mage ci
        run: mage ci
